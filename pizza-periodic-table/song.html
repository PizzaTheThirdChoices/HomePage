<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONG | PIZZA</title><link rel="stylesheet" href="style.css"></head><body><main><p><a href="index.html" style="color:#ddd">← 楽曲周期表に戻る</a></p><p class="eyebrow">PIZZA THE THIRD CHOICES / SONG DETAIL</p><section id="song-page" class="detail"></section><p class="intro">楽曲の解説・制作背景・音源リンクなどを今後追加できます。</p></main><script src="script.js"></script><script>const id=Number(new URLSearchParams(location.search).get('id'));const s=songs.find(x=>x.number===id);const target=document.querySelector('#song-page');if(s){document.title=s.title+' | PIZZA';const art=imageFor(s,'detail-art');if(art)target.append(art);const body=document.createElement('div');body.className='detail-body';const n=document.createElement('p');n.className='eyebrow';n.textContent=`ELEMENT ${s.number} / ${s.code}`;const h=document.createElement('h2');h.textContent=s.title;const album=document.createElement('p');album.textContent='収録：'+getAlbum(s);const desc=document.createElement('p');desc.textContent=descriptions[s.number]||'楽曲紹介文は準備中です。';body.append(n,h,album,desc);const video=videoFor(s);if(video)body.append(video);target.append(body)}else{target.textContent='楽曲が見つかりませんでした。'}</script></body></html>
