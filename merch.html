<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MERCH | Pizza The Third Choices</title>

  <!-- 共通スタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========================================
       SITE SHELL / ページ全体
  ========================================= -->
  <div class="site-shell">


    <!-- ========================================
         HEADER / ナビゲーション
  ========================================= -->
    <nav class="top-nav">

      <!-- サイト名・ホームへのリンク -->
      <a class="wordmark" href="index.html">
        Pizza The Third Choices
      </a>

      <!-- ページ移動メニュー -->
      <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="music.html">MUSIC</a>
        <a href="live.html">LIVE / ARCHIVE</a>
        <a class="active" href="merch.html">MERCH</a>
      </div>

      <!-- 公式SNS・配信サービスのアイコン -->
      <!-- data/social.js の設定から自動生成される -->
      <div
        class="social-links header-social"
        data-social-links
        aria-label="公式SNS・配信ストア"
      ></div>

    </nav>


    <!-- ========================================
         MAIN / グッズ紹介ページ
    ========================================= -->
    <main class="archive-main">

      <!-- ページ上部の小見出し -->
      <p class="eyebrow">
        PIZZA THE THIRD CHOICES / GOODS
      </p>

      <!-- ページタイトル -->
      <h1>MERCH</h1>

<!-- ======================================
           MERCH ITEMS / グッズ一覧
      ======================================= -->

      <!--
        この領域には、JavaScriptによって
        グッズ情報が自動生成される。

        現在登録しているグッズ：
        ・ステッカー（¥100 / 枚）
        ・Tシャツ（¥3,000 / 枚）

        表示する情報：
        ・商品名
        ・価格
        ・商品写真（複数枚対応）
        ・商品説明

        商品情報を変更する場合：
          data/merch.js

        写真を追加・変更する場合：
          assets/merch/

        表示方法を変更する場合：
          merch.js
          style.css

        ※ 写真の切り替え・スワイプ表示などは
           JavaScriptとCSSで制御する。
      -->
      <div
        id="merch-items"
        class="merch-items"
      ></div>

    </main>


    <!-- ========================================
         FOLLOW US / 公式SNS
    ========================================= -->
    <section class="social-section">

      <h2>FOLLOW US</h2>

      <!--
        公式SNS・配信サービスへのリンクを表示する。

        リンク先の変更は data/social.js で行う。
      -->
      <div
        class="social-links"
        data-social-links
      ></div>

    </section>


    <!-- ========================================
         FOOTER / フッター
    ========================================= -->
    <footer>
      © Pizza The Third Choices
    </footer>

  </div>


  <!-- ==========================================
       JAVASCRIPT / データと表示処理

       注意：
       以下の読み込み順は変更しない。
  =========================================== -->

  <!-- グッズ情報（商品名・価格・写真など） -->
  <script src="data/merch.js"></script>

  <!-- グッズ一覧・写真ギャラリーの表示処理 -->
  <script src="merch.js"></script>

  <!-- 公式SNS・配信サービスのリンク -->
  <script src="data/social.js"></script>

</body>
</html>
