<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LIVE DETAIL | Pizza The Third Choices</title>

  <!-- 共通スタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========================================
       SITE SHELL / ページ全体
  ========================================= -->
  <div class="site-shell">


    <!-- ========================================
         HEADER / ナビゲーション
    ========================================= -->
    <nav class="top-nav">

      <!-- サイト名・ホームへのリンク -->
      <a class="wordmark" href="index.html">
        <img
          src="assets/logo/Logo-White.png"
          alt="Pizza The Third Choices"
          onerror="this.hidden=true;this.nextElementSibling.hidden=false"
        >
        <span hidden>Pizza The Third Choices</span>
      </a>

      <!-- ページ移動メニュー -->
      <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="music.html">MUSIC</a>
        <a class="active" href="live.html">LIVE / ARCHIVE</a>
        <a href="merch.html">MERCH</a>
      </div>

      <!-- 公式SNS・配信サービスのアイコン -->
      <!-- data/social.js の設定から自動生成される -->
      <div
        class="social-links header-social"
        data-social-links
        aria-label="公式SNS・配信ストア"
      ></div>

    </nav>


    <!-- ========================================
         MAIN / ライブ詳細ページ
    ========================================= -->
    <main class="archive-main">

      <!-- ライブ一覧ページへ戻る -->
      <p>
        <a href="live.html">
          ← LIVE / ARCHIVE
        </a>
      </p>

      <!-- ======================================
           EVENT DETAIL / ライブ詳細情報
      ======================================= -->

      <!--
        この領域には、JavaScriptによって以下の情報が
        自動的に表示される。

        ・公演日
        ・イベント名
        ・会場
        ・出演者などの公演情報
        ・ライブフライヤー
        ・セットリスト

        イベント情報を追加・変更する場合は、
        このHTMLではなく data/events.js を編集する。
      -->
      <div id="event-detail"></div>

    </main>


    <!-- ========================================
         FOLLOW US / 公式SNS
    ========================================= -->
    <section class="social-section">

      <h2>FOLLOW US</h2>

      <!--
        SNS・配信サービスへのリンクを表示する。

        リンク先の変更は data/social.js で行う。
      -->
      <div
        class="social-links"
        data-social-links
      ></div>

    </section>


    <!-- ========================================
         FOOTER / フッター
    ========================================= -->
    <footer>
      © Pizza The Third Choices
    </footer>

  </div>


  <!-- ==========================================
       JAVASCRIPT / データと表示処理

       注意：
       読み込み順を変更しない。
  =========================================== -->

  <!-- ライブ情報のデータ・表示処理 -->
  <script src="data/events.js"></script>

  <!-- URLに対応するライブ詳細を表示 -->
  <script>
    renderEventDetail();
  </script>

  <!-- 公式SNS・配信サービスのリンク -->
  <script src="data/social.js"></script>

</body>
</html>
